<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>❤️Feliz Aniversario Amor 😍❤️</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
            background: linear-gradient(to bottom, #f8f9fa, #e9ecef);
            position: relative;
        }

        /* Estilos del carrusel */
        .carousel-container {
            width: 50%;
            height: 300px;
            position: relative;
            overflow: hidden;
            margin: 50px auto;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .carousel-slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .carousel-slide.active {
            opacity: 1;
        }

        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            cursor: pointer;
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.7);
            border: none;
            padding: 10px;
            cursor: pointer;
            z-index: 10;
        }

        .prev-btn {
            left: 10px;
        }

        .next-btn {
            right: 10px;
        }

        /* Estilos del texto central */
        .texto-central {
            text-align: center;
            padding: 40px;
            margin: 20px auto;
            max-width: 800px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 1;
        }

        .texto-central h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .texto-central p {
            color: #666;
            line-height: 1.6;
            font-size: 1.2em;
        }

        /* Estilos de los corazones */
        .corazon {
            position: fixed;
            top: -20px;
            /* Empiezan fuera de la pantalla */
            font-size: 24px;
            /* Tamaño más grande */
            color: #ff6b6b;
            pointer-events: none;
            z-index: 0;
            opacity: 0.8;
            animation: caida linear forwards;
        }

        @keyframes caida {
            from {
                transform: translateY(0) rotate(0deg);
            }

            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="texto-central">
        <h1>💑Hoy celebramos un año de estar juntos compartiendo momentos inolvidables💞</h1>
    </div>
    <!-- Carrusel -->
    <div class="carousel-container">
        <button class="carousel-btn prev-btn">←</button>
        <button class="carousel-btn next-btn">→</button>
        <div class="carousel-slide active">
            <video id="video1" width="640" height="360" muted>
                <source src="100.mp4" type="video/mp4">
            </video>
            <video id="video2" width="640" height="360" style="display: none;" muted>
                <source src="120.mp4" type="video/mp4">
            </video>
            <video id="video3" width="640" height="360" style="display: none;" muted>
                <source src="130.mp4" type="video/mp4">
            </video>
            <video id="video4" width="640" height="360" style="display: none;" muted>
                <source src="140.mp4" type="video/mp4">
            </video>
            <video id="video5" width="640" height="360" style="display: none;" muted>
                <source src="seis.mp4" type="video/mp4">
            </video>
            <video id="video6" width="640" height="360" style="display: none;" muted>
                <source src="seislll.mp4" type="video/mp4">
            </video>
            <video id="video7" width="640" height="360" style="display: none;" muted>
                <source src="seisvll.mp4" type="video/mp4">
            </video>
            <video id="video8" width="640" height="360" style="display: none;" muted>
                <source src="seisvl.mp4" type="video/mp4">
            </video>
            <video id="video9" width="640" height="360" style="display: none;" muted>
                <source src="seisll.mp4" type="video/mp4">
            </video>
            <video id="video10" width="640" height="360" style="display: none;" muted>
                <source src="seisv.mp4" type="video/mp4">
            </video>
            <video id="video11" width="640" height="360" style="display: none;" muted>
                <source src="seislv.mp4" type="video/mp4">
            </video>

        </div>
    </div>

    <div class="texto-central">
        <h1>Feliz Aniversario Amor</h1>
        <h1>Te Amoooo! Te dedico esta canción!</h1>
        <audio autoplay>
            <source src="Sherine.mp3" type="audio/mp3">
        </audio>
    </div>


    <script>
        // Funcionalidad del carrusel
        const slides = document.querySelectorAll('.carousel-slide');
        const prevBtn = document.querySelector('.prev-btn');
        const nextBtn = document.querySelector('.next-btn');
        let currentSlide = 0;
        const videos = [
            document.getElementById("video1"),
            document.getElementById("video2"),
            document.getElementById("video3"),
            document.getElementById("video4"),
            document.getElementById("video5"),
            document.getElementById("video6"),
            document.getElementById("video7"),
            document.getElementById("video8"),
            document.getElementById("video9"),
            document.getElementById("video10"),
            document.getElementById("video11"),
        ];
        let currentVideo = 0;

        function playNextVideo() {
            if (currentVideo < videos.length - 1) {
                videos[currentVideo].style.display = "none";
                currentVideo++;
                videos[currentVideo].style.display = "block";
                videos[currentVideo].play();
            }

        }
        videos.forEach(video => {
            video.addEventListener("ended", playNextVideo);
        });
        videos[0].play();

        function showSlide(n) {

            slides.forEach(slide => slide.classList.remove('active'));
            currentSlide = (n + slides.length) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        prevBtn.addEventListener('click', () => showSlide(currentSlide - 1));
        nextBtn.addEventListener('click', () => showSlide(currentSlide + 1));

        // Cambio automático de slides
        //setInterval(() => showSlide(currentSlide + 1), 5000);

        // Animación de corazones cayendo
        function crearCorazon() {
            const corazon = document.createElement('div');
            corazon.className = 'corazon';
            corazon.textContent = '♥'; // Corazón en texto en lugar de emoji

            // Posición horizontal aleatoria
            corazon.style.left = Math.random() * 100 + 'vw';

            // Velocidad aleatoria entre 3 y 6 segundos
            const duracion = Math.random() * 3 + 3;
            corazon.style.animationDuration = duracion + 's';

            // Tamaño aleatorio
            const tamaño = Math.random() * 20 + 20;
            corazon.style.fontSize = tamaño + 'px';

            document.body.appendChild(corazon);

            // Eliminar el corazón después de la animación
            setTimeout(() => {
                corazon.remove();
            }, duracion * 1000);
        }

        // Iniciar la creación de corazones cuando la página esté cargada
        document.addEventListener('DOMContentLoaded', () => {
            // Crear corazones cada 200ms
            setInterval(crearCorazon, 200);
        });
    </script>
</body>

</html>
